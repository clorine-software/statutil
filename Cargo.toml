[package]
name = "statutil"
version = "1.0.1"
edition = "2024"
repository = "https://github.com/clorine-software/statutil"
# homepage = "https://github.com/clorine-software/statutil"
# authors = ["clorine-software", "nd1", "slawacats"]

[dependencies]
anyhow = "1.0.104"
colored = "3.1.1"
humantime = "2.4.0"
notify-rust = "4.18.0"
surge-ping = "0.9.0"
tokio = { version = "1.53.1", features = ["full"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
